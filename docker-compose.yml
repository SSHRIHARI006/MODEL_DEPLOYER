# Single production compose file. Every credential and connection setting comes
# from .env (see .env.example); nothing is hardcoded here. Internal services
# (db, redis, minio, worker) publish no host ports — they are reachable only on
# the Compose network. Only the API and frontend are exposed.

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

  minio:
    # minio/minio was removed from Docker Hub (and quay.io now requires auth),
    # so this is the community rebuild of the same MinIO release. The S3 API,
    # env vars, and data layout are unchanged.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  createbuckets:
    build:
      context: .
      dockerfile: Dockerfile.api
    # Uses the API image (already ships boto3) instead of minio/mc, whose
    # :latest image is not reliably runnable for the init one-shot.
    depends_on:
      minio:
        condition: service_healthy
    env_file: .env
    entrypoint: ["python", "-c"]
    command: >
      "import os,boto3;
      b=os.environ['MINIO_BUCKET'];
      s3=boto3.client('s3',endpoint_url=os.environ['MINIO_ENDPOINT'],
      aws_access_key_id=os.environ['MINIO_ROOT_USER'],
      aws_secret_access_key=os.environ['MINIO_ROOT_PASSWORD']);
      names=[d['Name'] for d in s3.list_buckets().get('Buckets',[])];
      names.count(b)==0 and s3.create_bucket(Bucket=b);
      print('bucket ready')"
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    # Run the Celery worker directly: migrations are handled by the api service.
    entrypoint: []
    command: ["celery", "-A", "config", "worker", "--loglevel=info"]
    depends_on:
      api:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    depends_on:
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    volumes:
      - worker_storage:/app/storage
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4g

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  postgres_data:
  redis_data:
  minio_data:
  worker_storage:
