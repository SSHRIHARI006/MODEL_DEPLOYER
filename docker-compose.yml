version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: model_deployer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # Self-hosted Object Storage for Model Artifacts
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: adminpassword
    ports:
      - "9000:9000" # API Port
      - "9001:9001" # Web UI Console
    volumes:
      - minio_data:/data
    restart: unless-stopped

  # Automatically create the 'model-artifacts' bucket on startup
  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc config host add myminio http://minio:9000 admin adminpassword;
      /usr/bin/mc mb myminio/model-artifacts || true;
      /usr/bin/mc anonymous set public myminio/model-artifacts;
      exit 0;
      "

  api:
    build: 
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      - DATABASE_URL=postgres://postgres:postgrespassword@db:5432/model_deployer
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - AWS_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=adminpassword
      - RUNNER_BASE_URL=http://worker:8002
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - minio

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=adminpassword
    ports:
      - "8002:8002"
    depends_on:
      - minio
    volumes:
      - worker_storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
  worker_storage:
