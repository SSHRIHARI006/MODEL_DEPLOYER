version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: model_deployer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # Self-hosted Object Storage for Model Artifacts
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: adminpassword
    ports:
      - "9000:9000" # API Port
      - "9001:9001" # Web UI Console
    volumes:
      - minio_data:/data
    restart: unless-stopped

  # Automatically create the 'model-artifacts' bucket on startup
  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc config host add myminio http://minio:9000 admin adminpassword;
      /usr/bin/mc mb myminio/model-artifacts || true;
      /usr/bin/mc anonymous set public myminio/model-artifacts;
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
