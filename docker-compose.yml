# Single production compose file. Every credential and connection setting comes
# from .env (see .env.example); nothing is hardcoded here. Internal services
# (db, redis, minio, worker) publish no host ports — they are reachable only on
# the Compose network. Only the API and frontend are exposed.

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    image: redis:7-alpine
    # SEC-08: authentication required. The password is supplied through the
    # environment and reused by the healthcheck via REDISCLI_AUTH, so it is not
    # repeated in the healthcheck's argument list.
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

  minio:
    # minio/minio was removed from Docker Hub (and quay.io now requires auth),
    # so this is the community rebuild of the same MinIO release. The S3 API,
    # env vars, and data layout are unchanged.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  minio-init:
    # Creates the artifacts bucket and the read-only identity the runner uses to
    # download artifacts (SEC-01). Root credentials are used here, in this
    # one-shot job only; the worker never receives them. The pinned MinIO image
    # already ships `mc`, so no additional tooling image is pulled.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      MINIO_BUCKET: ${MINIO_BUCKET:?MINIO_BUCKET is required}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_WORKER_USER: ${MINIO_WORKER_USER:?MINIO_WORKER_USER is required}
      MINIO_WORKER_PASSWORD: ${MINIO_WORKER_PASSWORD:?MINIO_WORKER_PASSWORD is required}
    volumes:
      - ./deploy/minio/worker-artifacts-readonly-policy.json:/policies/worker-artifacts-readonly.json:ro
    # bash (not sh) because the policy template is filled in with a bash builtin:
    # the MinIO image ships no sed, and the policy file in deploy/minio stays the
    # single source of truth for what the runner's identity may do.
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "set -eu;
      for ((attempt=1; attempt<=30; attempt++)); do
      if mc alias set local \"$$MINIO_ENDPOINT\" \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\"; then break; fi;
      if [ \"$$attempt\" -eq 30 ]; then exit 1; fi; sleep 2;
      done;
      mc mb --ignore-existing \"local/$$MINIO_BUCKET\";
      read -r -d '' policy < /policies/worker-artifacts-readonly.json || true;
      printf '%s' \"$${policy//__ARTIFACTS_BUCKET__/$$MINIO_BUCKET}\" > /tmp/worker-policy.json;
      mc admin user add local \"$$MINIO_WORKER_USER\" \"$$MINIO_WORKER_PASSWORD\";
      mc admin policy create local modeldeployer-artifacts-readonly /tmp/worker-policy.json || mc admin policy add local modeldeployer-artifacts-readonly /tmp/worker-policy.json || true;
      mc admin policy attach local modeldeployer-artifacts-readonly --user \"$$MINIO_WORKER_USER\";
      echo 'minio bootstrap complete'"
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 256m

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    ports:
      # Host-local only: the public entry point is the reverse proxy.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    # Run the Celery worker directly: migrations are handled by the api service.
    entrypoint: []
    command: ["sh", "-c", "celery -A config worker --loglevel=info --concurrency=$${CELERY_WORKER_CONCURRENCY:-2}"]
    depends_on:
      api:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    # SEC-01: deliberately no `env_file: .env`. The runner receives an explicit
    # allowlist and nothing else — no Django secret, database, Redis, Celery, or
    # MinIO admin credentials. Egress/credential scope is documented in
    # docs/security.md.
    environment:
      STORAGE_ROOT: /app/storage
      RUNNER_AUTH_TOKEN: ${RUNNER_AUTH_TOKEN:?RUNNER_AUTH_TOKEN is required}
      RUNNER_AUTH_HEADER: ${RUNNER_AUTH_HEADER:-X-Runner-Token}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      MINIO_BUCKET: ${MINIO_BUCKET:?MINIO_BUCKET is required}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_WORKER_USER: ${MINIO_WORKER_USER:?MINIO_WORKER_USER is required}
      MINIO_WORKER_PASSWORD: ${MINIO_WORKER_PASSWORD:?MINIO_WORKER_PASSWORD is required}
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - worker_storage:/app/storage
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4g

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-80}:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  postgres_data:
  redis_data:
  minio_data:
  worker_storage:
