name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Checks & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov anyio

      - name: Django system check
        run: python manage.py check

      - name: Migration consistency check
        run: python manage.py makemigrations --check --dry-run

      - name: Run unit & contract tests
        run: |
          pytest -m "not integration and not e2e and not failure_injection" \
            --junitxml=test-results/junit-backend.xml \
            --cov=. --cov-report=xml:test-results/coverage.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test-results/

  frontend:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Lint
        run: cd frontend && npm run lint

      - name: Unit tests
        run: cd frontend && npm run test -- --run

      - name: Type check
        run: cd frontend && npx tsc --noEmit

      - name: Build bundle
        run: cd frontend && npm run build

      - name: Install Chromium for browser tests
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: cd frontend && npm run test:e2e

  integration:
    name: Integration Profile (Postgres, Redis, MinIO)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: model_deployer_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadminpassword
        ports:
          - 9000:9000
        options: >-
          server /data

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django psycopg2-binary

      - name: Run real-service integration tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings_integration
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5432
          TEST_REDIS_URL: redis://localhost:6379/2
          MINIO_ENDPOINT: http://localhost:9000
        run: |
          pytest -m integration --junitxml=test-results/junit-integration.xml
