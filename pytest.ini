[pytest]
DJANGO_SETTINGS_MODULE = config.settings_test
python_files = tests.py test_*.py *_tests.py
norecursedirs = storage node_modules frontend .venv
addopts = -q --disable-warnings --strict-markers
markers =
    integration: tests requiring real PostgreSQL, Redis, and MinIO services
    e2e: end-to-end browser tests
    failure_injection: failure injection tests
